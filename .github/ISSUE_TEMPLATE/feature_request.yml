name: Feature request
description: Suggest something the reader should do
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the task, not the solution. The underlying need is more useful than a prescribed fix.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What would help?
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: What do you do instead today?
      description: If another reader solves this, say how — it is useful reference.
    validations:
      required: false
